# Nginx de DevKora dans le conteneur. Reprend deploy/nginx/devkora-app.conf ; le HTTPS est assuré par Systalink.
server {
    listen ${PORT} default_server;
    server_name _;
    root /var/www/devkora/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 6m;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    include snippets/devkora-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    location ~ /\.(?!well-known/) { return 404; }

    location ^~ /build/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/devkora-security-headers.conf;
    }

    location ~ ^/(fonts|images)/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=604800" always;
        include snippets/devkora-security-headers.conf;
    }

    location = /favicon.ico { access_log off; log_not_found off; expires 7d; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $fwd_https;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ { return 404; }
}

# Le proxy de Systalink termine le HTTPS : on transmet le protocole d'origine à PHP.
map $http_x_forwarded_proto $fwd_https {
    default "";
    https on;
}
