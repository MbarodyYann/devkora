; Pool PHP-FPM dédié à DevKora. À copier dans /etc/php/8.2/fpm/pool.d/devkora.conf.
; PHP s'exécute sous l'utilisateur devkora (propriétaire du code), Nginx (www-data) parle au socket.

[devkora]
user = devkora
group = devkora

listen = /run/php/php8.2-fpm-devkora.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Serveur de 2 Go : environ 40 Mo par processus, 10 processus au plus.
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Requêtes lentes journalisées (au-delà de 5 s).
request_slowlog_timeout = 5s
slowlog = /var/log/php8.2-fpm-devkora.slow.log

; Photo de profil : 4 Mo au plus (règle de validation max:4096).
php_admin_value[upload_max_filesize] = 4M
php_admin_value[post_max_size] = 6M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60

; Aucune erreur affichée aux visiteurs : elles vont dans le journal de Laravel.
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.2-fpm-devkora.error.log

; Cookies de session de PHP non utilisés (Laravel gère ses sessions), mais durcis par principe.
php_admin_flag[session.cookie_httponly] = on
php_admin_flag[session.use_strict_mode] = on

; OPcache : le code n'est relu qu'au rechargement de PHP-FPM, fait par deploy.sh.
php_admin_flag[opcache.enable] = on
php_admin_flag[opcache.validate_timestamps] = off
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.max_accelerated_files] = 20000
