# Accès TEMPORAIRE par l'adresse IP du serveur, en HTTP, le temps de choisir le domaine.
# Pas de certificat possible pour une IP : pendant cette période, SESSION_SECURE_COOKIE=false dans .env
# (sinon la connexion est impossible). À supprimer dès que devkora.conf est en place.
#
# À copier dans /etc/nginx/sites-available/devkora-ip.conf. Voir le guide de déploiement.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/devkora.access.log;
    error_log /var/log/nginx/devkora.error.log warn;

    include snippets/devkora-app.conf;
}
