# En-têtes de sécurité de DevKora, inclus par devkora-app.conf (serveur et emplacements des assets).
# Nginx n'hérite pas des add_header d'un bloc parent dès qu'un bloc enfant en déclare : chaque
# emplacement qui ajoute ses propres en-têtes inclut aussi ce fichier.
#
# Les tests navigateur (tests/Browser/router.php) lisent ce fichier et appliquent exactement ces en-têtes
# en local : toute violation de la CSP sur une page fait échouer les tests.
#
# CSP :
# - script-src 'unsafe-eval' : Alpine (embarqué par Livewire 3) évalue les expressions x-data, x-on… ;
#   aucun script en ligne n'est autorisé, sauf l'anti-flash du thème, autorisé par son empreinte sha256
#   (vérifiée par tests/Feature/Deploy/SecurityHeadersTest.php).
# - style-src 'unsafe-inline' : attributs style (barres du Pouls) et styles injectés par Livewire.
# - aucune origine externe : polices, images et scripts sont servis par DevKora.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'sha256-qwN5TO+UKZ/8alQfeyMUfwj6hkHH5/XX+/WyYhcSrTc='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
