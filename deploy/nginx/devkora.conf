# DevKora en HTTPS (Let's Encrypt). À copier dans /etc/nginx/sites-available/devkora.conf,
# en remplaçant chaque devkora.example par le domaine choisi. Voir le guide de déploiement.

# HTTP : uniquement la validation Let's Encrypt, puis redirection vers HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name devkora.example www.devkora.example;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://devkora.example$request_uri;
    }
}

# www → domaine nu.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.devkora.example;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/devkora.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devkora.example/privkey.pem;
    include snippets/devkora-tls.conf;

    return 301 https://devkora.example$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name devkora.example;

    ssl_certificate /etc/letsencrypt/live/devkora.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devkora.example/privkey.pem;
    include snippets/devkora-tls.conf;

    access_log /var/log/nginx/devkora.access.log;
    error_log /var/log/nginx/devkora.error.log warn;

    include snippets/devkora-app.conf;
}
