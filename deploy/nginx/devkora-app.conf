# Règles communes de DevKora, incluses par devkora.conf (HTTPS) et devkora-ip.conf (accès temporaire par l'IP).
# À copier dans /etc/nginx/snippets/ avec devkora-security-headers.conf.

root /var/www/devkora/public;
index index.php;
charset utf-8;
server_tokens off;

# Photo de profil : 4 Mo au plus côté application (upload_max_filesize = 4M), marge pour le formulaire.
client_max_body_size 6m;

include snippets/devkora-security-headers.conf;

# Compression du texte (HTML, CSS, JS, SVG, XML du sitemap) : le poids de l'accueil est mesuré ainsi.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

# Fichiers cachés (.env, .git…) refusés, sauf la validation Let's Encrypt.
location ~ /\.(?!well-known/) {
    return 404;
}

location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
}

# Assets de Vite : leur nom contient une empreinte, ils ne changent jamais. Cache d'un an.
location ^~ /build/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include snippets/devkora-security-headers.conf;
}

# Polices et images sans empreinte : cache d'une semaine.
location ~ ^/(fonts|images)/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=604800" always;
    include snippets/devkora-security-headers.conf;
}

location = /favicon.ico { access_log off; log_not_found off; expires 7d; }

# Tout le reste passe par Laravel. Le sitemap et robots.txt sont des routes (contenu dynamique).
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Seul index.php est exécuté.
location = /index.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_pass unix:/run/php/php8.2-fpm-devkora.sock;
    fastcgi_hide_header X-Powered-By;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_read_timeout 60s;
}

# Tout autre fichier PHP (y compris dans public/storage) : jamais exécuté.
location ~ \.php$ {
    return 404;
}
